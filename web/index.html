<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SirfBill Billing System">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="SirfBill">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">

  <title>SirfBill</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *, html, body, flutter-view, flt-glass-pane, canvas {
      overscroll-behavior: none !important;
      overscroll-behavior-x: none !important;
      overscroll-behavior-y: none !important;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
  <script>
    // Block browser two-finger swipe navigation (history back/forward) on Chrome/Safari trackpads
    window.addEventListener('wheel', function(e) {
      if (Math.abs(e.deltaX) > 0) {
        e.preventDefault();
      }
    }, { passive: false });

    // Lock browser back arrow so clicking Chrome's "←" does not exit or disrupt working sessions
    (function() {
      function lockNavigation() {
        window.history.pushState(null, document.title, window.location.href);
      }
      lockNavigation();
      window.addEventListener('popstate', function() {
        lockNavigation();
      });
    })();
  </script>

  <!-- Razorpay Official Checkout SDK -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    (function() {
      window.addEventListener('sirfbill_launch_razorpay', function(e) {
        console.log('[SirfBill] sirfbill_launch_razorpay event caught', e);
        try {
          var raw = e.detail;
          var options = {};
          if (typeof raw === 'string') {
            try { options = JSON.parse(raw); } catch (pErr) { options = {}; }
          } else if (raw && typeof raw === 'object') {
            options = raw;
          }

          if (!window.Razorpay) {
            console.error('[SirfBill] window.Razorpay SDK not loaded on window');
            window.dispatchEvent(new CustomEvent('sirfbill_razorpay_dismiss', {
              detail: JSON.stringify({ error: 'Razorpay SDK script not loaded' })
            }));
            return;
          }

          var key = (options.key && String(options.key).trim().length > 0)
            ? String(options.key).trim()
            : 'rzp_live_ReRSf5hDkv7b7S';

          var parsedAmount = Number(options.amount) || 299;
          var paise = Math.round(parsedAmount * 100);

          var rzpOptions = {
            key: key,
            amount: paise,
            currency: options.currency || 'INR',
            name: options.name || 'SirfBill Technologies',
            description: options.description || 'SirfBill Restaurant Pro License',
            image: options.image || 'favicon.png',
            order_id: (options.orderId && String(options.orderId).trim().length > 0) ? String(options.orderId).trim() : undefined,
            prefill: {
              name: options.userName || 'Restaurant Admin',
              email: options.userEmail || 'admin@sirfbill.com',
              contact: options.userContact || '9876543210'
            },
            theme: {
              color: options.themeColor || '#0C2340'
            },
            modal: {
              backdropclose: false,
              escape: true,
              handleback: true,
              confirm_close: true,
              ondismiss: function() {
                console.log('[SirfBill] Razorpay modal dismissed');
                window.dispatchEvent(new CustomEvent('sirfbill_razorpay_dismiss', {
                  detail: JSON.stringify({ error: 'Dismissed by user' })
                }));
              }
            },
            handler: function(response) {
              console.log('[SirfBill] Razorpay payment success:', response);
              window.dispatchEvent(new CustomEvent('sirfbill_razorpay_success', {
                detail: JSON.stringify({
                  payment_id: response.razorpay_payment_id || '',
                  order_id: response.razorpay_order_id || (options.orderId || ''),
                  signature: response.razorpay_signature || ''
                })
              }));
            }
          };

          console.log('[SirfBill] Launching Razorpay with options:', rzpOptions);
          var rzp = new window.Razorpay(rzpOptions);

          rzp.on('payment.failed', function(resp) {
            console.warn('[SirfBill] Razorpay payment failed:', resp);
            var desc = (resp && resp.error && resp.error.description) ? resp.error.description : 'Payment Failed';
            window.dispatchEvent(new CustomEvent('sirfbill_razorpay_dismiss', {
              detail: JSON.stringify({ error: desc })
            }));
          });

          rzp.open();
          console.log('[SirfBill] rzp.open() called successfully');
        } catch (err) {
          console.error('[SirfBill] Uncaught error launching Razorpay:', err);
          window.dispatchEvent(new CustomEvent('sirfbill_razorpay_dismiss', {
            detail: JSON.stringify({ error: String(err) })
          }));
        }
      });
    })();
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
